[package]
name = "better-alt1"
version = "0.1.0"
description = "Passive screen-reading overlay toolkit"
license = "MIT"
edition = "2021"
rust-version = "1.82"
publish = false
# Without this, the capture-fixture bin makes a bare `cargo run` ambiguous and
# `tauri dev` fails before it ever starts.
default-run = "better-alt1"

[lib]
name = "better_alt1_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
thiserror = "2"
xcap = "0.9.8"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
