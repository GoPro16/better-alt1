packages:
  - apps/*
  - packages/*

# Refuse to install any version published less than a day ago. A compromised release is
# usually yanked within hours, so waiting costs us nothing and skips the blast radius.
minimumReleaseAge: 1440

onlyBuiltDependencies:
  - esbuild

# Single source of truth for third-party versions. Packages reference these with
# `"dep": "catalog:"`, so a bump happens here once instead of in every package.json.
catalog:
  # Toolchain
  oxlint: ^1.77.0
  typescript: ^7.0.2
  vitest: ^4.1.10
  "@vitest/coverage-v8": ^4.1.10

  # React
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  "@types/node": ^22.10.0

  # Build
  vite: ^8.2.1
  "@vitejs/plugin-react": ^6.0.5

  # Tauri
  "@tauri-apps/api": ^2.11.1
  "@tauri-apps/cli": ^2.11.4
  "@tauri-apps/plugin-process": ^2.3.1
  "@tauri-apps/plugin-updater": ^2.10.1

  # TanStack
  "@tanstack/react-form": ^1.33.3
  "@tanstack/react-query": ^5.101.4
  "@tanstack/react-query-devtools": ^5.101.4
  "@tanstack/react-router": ^1.170.22
  "@tanstack/react-router-devtools": ^1.167.1
  "@tanstack/router-cli": ^1.167.25
  "@tanstack/router-plugin": ^1.168.27

  # Styling and UI. `radix-ui`, `sonner` and `next-themes` are pulled in by shadcn
  # components; keep them catalogued so `shadcn add` does not drift them.
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  tw-animate-css: ^1.4.0
  tailwind-merge: ^3.6.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  lucide-react: ^1.30.0
  radix-ui: ^1.6.7
  sonner: ^2.0.7
  next-themes: ^0.4.6
  shadcn: ^4.16.2
  motion: ^12.43.0

minimumReleaseAgeExclude:
  - '@tanstack/react-router@1.170.22'
  - '@tanstack/router-cli@1.167.25'
  - '@tanstack/router-core@1.171.19'
  - '@tanstack/router-generator@1.167.25'
  - '@tanstack/router-plugin@1.168.27'
  - lucide-react@1.30.0
