# Runs the same gates as `pnpm check` plus the Rust suite, on the platform we ship.
# PRs only — pushes to main get checked by the release workflow before anything ships,
# so per-push CI would mostly be noise.
#
# Actions are pinned to commit SHAs, not tags: tags are mutable, and a moved tag runs
# someone else's code in our jobs. Bump the SHA and the trailing comment together.
name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4, version from package.json "packageManager"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # oxlint + compliance scan + tsc -b + vitest
      - run: pnpm check

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      # Display-dependent tests are `#[ignore]`d and stay local; fixture-backed tests run here.
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      # RustSec advisory scan over Cargo.lock (npm's side is covered by pnpm audit +
      # minimumReleaseAge). install-action ships a prebuilt binary, so this stays fast.
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-audit

      - run: cargo audit --file apps/desktop/src-tauri/Cargo.lock
