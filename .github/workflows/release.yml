# Cut a release from the Actions tab: pick a bump (patch/minor/major), and this bumps the
# version in every manifest, commits, tags, builds the installer, signs the updater
# artifact with TAURI_SIGNING_PRIVATE_KEY, and publishes a GitHub Release including
# latest.json — the manifest the app's updater polls (see plugins.updater in
# tauri.conf.json).
#
# Everything happens in one run because a tag pushed with the default GITHUB_TOKEN
# deliberately does not trigger other workflows. The tag trigger below exists only as a
# fallback for a hand-pushed tag, and skips the bump (it builds whatever version the
# manifests already say — make sure they match the tag).
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # Pinned to commit SHAs, not tags — this job holds the updater signing key, and a
      # moved tag would run someone else's code next to it. Keep SHA + comment in step.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      # The same gates CI runs on PRs. They run here, before the bump commits and tags
      # anything, so a failed release leaves no trace to clean up.
      - run: pnpm check

      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Bump version, commit, tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          $version = node scripts/bump-version.mjs ${{ inputs.bump }}
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Keep Cargo.lock's own entry in step with Cargo.toml so the repo never shows
          # a stale version. Resolves metadata only; nothing is compiled here.
          cargo update -p better-alt1 --manifest-path apps/desktop/src-tauri/Cargo.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release v$version"
          git tag "v$version"
          git push origin "HEAD:${{ github.ref_name }}" "v$version"

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: better-alt1 v__VERSION__
          releaseDraft: false
